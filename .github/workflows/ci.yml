# HCG Animation Center — CI
#
#   format-linux   HCGAnimationKit format tests on Linux (proves the format has no Apple dependency) + Python validator
#   macos          kit tests on macOS, the studio app (.app, universal), its self-tests in a real GUI session,
#                  the sample pack, exports, catalog; uploads the app and evidence
#   maker-demo     builds Samples/MakerDemo THROUGH HCG Executable Maker's real New Build wizard (headless driver),
#                  then launches the finished app and checks it contains and plays the bundled pack
#
# Hosted macOS runners are virtual machines, not the MacBook Pro M4 Max: hardware-only checks (real sleep/wake, real
# display hot-plug, Low Power Mode, macOS 27) are in docs/MAC-HARDWARE-CHECKLIST.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Vendored files unchanged
        run: scripts/check-vendored.sh
      - name: HCGAnimationKit tests (Linux)
        working-directory: Packages/HCGAnimationKit
        run: swift test
      - name: hcgpack validates the sample pack and catalogs
        working-directory: Packages/HCGAnimationKit
        run: |
          swift build -c release --product hcgpack
          .build/release/hcgpack validate ../../Samples/OrbitalCommand.hcgpack
          .build/release/hcgpack validate-catalog ../../catalog/catalog.json
          .build/release/hcgpack validate-catalog ../../Samples/catalog.local.json
      - name: Python validator (independent implementation, JSON Schemas)
        run: |
          pip install --quiet "jsonschema>=4.18"
          python3 scripts/validate_pack.py Samples/OrbitalCommand.hcgpack --catalog catalog/catalog.json --catalog Samples/catalog.local.json

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - name: Host
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string || true
          xcode-select -p; swift --version
          system_profiler SPDisplaysDataType | sed -n '1,40p' || true
          pmset -g || true
          mkdir -p "$OUT"
      - name: HCGAnimationKit build (incl. the AppKit player) and tests (macOS, CryptoKit vs portable SHA-256)
        working-directory: Packages/HCGAnimationKit
        run: |
          swift build
          swift test
      - name: Build HCG Animation Center.app (universal)
        run: scripts/build-app.sh --universal --output "$OUT"
      - name: Inspect the app
        run: |
          APP="$OUT/HCG Animation Center.app"
          plutil -p "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/HCGAnimationCenter"
          vtool -show-build "$APP/Contents/MacOS/HCGAnimationCenter" | grep -E 'platform|minos|sdk'
          codesign --verify --strict --deep --verbose=2 "$APP"
          ls -la "$APP/Contents/Resources"
      - name: Self-test — library import, desktop apply/stop x20, displays, sleep/wake, policies, restore
        run: |
          APP="$OUT/HCG Animation Center.app"
          "$APP/Contents/MacOS/HCGAnimationCenter" --self-test --report "$OUT/self-test.json" --screenshots "$OUT/screens"
          cat "$OUT/self-test.json"
      - name: Launch normally (editor window), screenshot, quit
        run: |
          APP="$OUT/HCG Animation Center.app"
          open -n "$APP" --args --open-sample
          sleep 12
          pgrep -f "HCG Animation Center.app/Contents/MacOS/HCGAnimationCenter"
          screencapture -x "$OUT/screens/editor-launch.png"
          osascript -e 'tell application id "com.hakmicapitalgroup.animationcenter.mac" to quit' || pkill -f HCGAnimationCenter
      - name: Package for download (zip with ditto)
        run: |
          cd "$OUT" && ditto -c -k --sequesterRsrc --keepParent "HCG Animation Center.app" "HCG-Animation-Center-mac.zip"
          shasum -a 256 HCG-Animation-Center-mac.zip | tee HCG-Animation-Center-mac.zip.sha256
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcg-animation-center-mac
          path: |
            ${{ github.workspace }}/out/HCG-Animation-Center-mac.zip
            ${{ github.workspace }}/out/HCG-Animation-Center-mac.zip.sha256
            ${{ github.workspace }}/out/self-test.json
            ${{ github.workspace }}/out/screens
          if-no-files-found: warn
          retention-days: 14

  maker-demo:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # HCG Executable Maker, main at the time of this milestone (unchanged: the demo uses its existing
      # AppPackaging.json contract and Swift → .app route; no Maker change was needed).
      MAKER_COMMIT: 2842998e778d687cf7653100c280875df93f8f1a
    steps:
      - uses: actions/checkout@v4
        with:
          path: animation-centre
      - uses: actions/checkout@v4
        with:
          repository: F1r3srp3nt/HCG-Executable-Maker
          ref: ${{ env.MAKER_COMMIT }}
          path: maker
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build HCG Executable Maker and its UI driver (real app views, headless)
        run: |
          echo "OUT=$RUNNER_TEMP/maker-out" >> "$GITHUB_ENV"
          dotnet build maker/tools/ui-driver -c Release
          dotnet maker/src/HCG.ExecutableMaker.App/bin/Release/net10.0/HCGExecutableMaker.dll --version
          git -C maker log -1 --format='Maker commit %H %s'
      - name: Build Samples/MakerDemo THROUGH Maker's New Build wizard (import folder → choose package → evaluate → configure → contract → build)
        run: >
          dotnet maker/tools/ui-driver/bin/Release/net10.0/hcg-ui-driver.dll
          --source "$GITHUB_WORKSPACE/animation-centre" --package Samples/MakerDemo
          --product HCGPackDemo --name "HCG Pack Demo" --bundle-id com.hakmicapitalgroup.packdemo
          --arch arm64 --formats app,zip --confirm-contract
          --output "$OUT" --screenshots "$OUT/screens" --prefix packdemo
      - name: Maker's own post-build checks of the finished app (signature, Info.plist, slices, launch, screenshot)
        run: |
          APP="$(find "$OUT/artifacts" -maxdepth 4 -name '*.app' -type d | head -1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          maker/tools/ui-driver/verify-macos-app.sh "$APP" "$OUT/screens/launch-packdemo.png" arm64
      - name: The finished app contains the pack, byte for byte, and declares it (project-level opt-in)
        run: |
          ls -la "$APP/Contents/Resources/OrbitalCommand.hcgpack"
          diff -r animation-centre/Samples/OrbitalCommand.hcgpack "$APP/Contents/Resources/OrbitalCommand.hcgpack"
          echo "identical to Samples/OrbitalCommand.hcgpack"
          /usr/libexec/PlistBuddy -c 'Print :HCGAnimationPack' -c 'Print :HCGAnimationPlacement' "$APP/Contents/Info.plist"
          shasum -a 256 "$APP/Contents/Resources/OrbitalCommand.hcgpack/media.mp4"
          codesign --verify --strict --deep --verbose=2 "$APP"
      - name: The finished app plays the pack offline and keeps its controls usable
        run: |
          set -o pipefail
          report="$TMPDIR/hcg-pack-demo.txt"
          run() {
            rm -f "$report"
            open -n "$APP" --args --self-check "$@"
            for _ in $(seq 1 60); do grep -q '^done=1' "$report" 2>/dev/null && break; sleep 1; done
            cat "$report"
          }
          echo "--- normal run"; run | tee "$OUT/demo-run.txt"
          grep -q '^pack=loaded' "$OUT/demo-run.txt"
          grep -q '^verify=ok' "$OUT/demo-run.txt"
          grep -q '^state=Playing' "$OUT/demo-run.txt"
          grep -q '^advanced=yes' "$OUT/demo-run.txt"
          grep -q '^videoOnScreen=yes' "$OUT/demo-run.txt"
          grep -q '^click=Launch Mission .* works=yes' "$OUT/demo-run.txt"
          grep -q '^toggle=Animate background .* works=yes' "$OUT/demo-run.txt"
          ! grep -q 'isBackground=true' "$OUT/demo-run.txt"
          echo "--- playback unavailable → still"; run --simulate-playback-failure | tee "$OUT/demo-run-still.txt"
          grep -q '^state=Still frame — playback unavailable' "$OUT/demo-run-still.txt"
          grep -q '^still=yes' "$OUT/demo-run-still.txt"
          grep -q '^click=Launch Mission .* works=yes' "$OUT/demo-run-still.txt"
      - name: Offline proof — run with all networking denied by the sandbox
        run: |
          rm -f "$TMPDIR/hcg-pack-demo.txt"
          if command -v sandbox-exec >/dev/null; then
            exe="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
            sandbox-exec -p '(version 1)(allow default)(deny network*)' "$exe" --self-check &
            for _ in $(seq 1 60); do grep -q '^done=1' "$TMPDIR/hcg-pack-demo.txt" 2>/dev/null && break; sleep 1; done
            cat "$TMPDIR/hcg-pack-demo.txt" | tee "$OUT/demo-run-offline.txt"
            grep -q '^state=Playing' "$OUT/demo-run-offline.txt"
            grep -q '^advanced=yes' "$OUT/demo-run-offline.txt"
          else
            echo "sandbox-exec not available on this image: offline run not performed"
          fi
      - name: The ZIP Maker produced holds the same app
        run: |
          zip="$(find "$OUT/artifacts" -maxdepth 4 -name '*.zip' | head -1)"
          mkdir -p "$RUNNER_TEMP/unzipped" && ditto -x -k "$zip" "$RUNNER_TEMP/unzipped"
          diff -r animation-centre/Samples/OrbitalCommand.hcgpack "$(find "$RUNNER_TEMP/unzipped" -maxdepth 2 -name '*.app' | head -1)/Contents/Resources/OrbitalCommand.hcgpack"
          shasum -a 256 "$zip" | tee "$OUT/demo-zip.sha256"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcg-pack-demo-built-by-maker
          path: |
            ${{ runner.temp }}/maker-out/artifacts
            ${{ runner.temp }}/maker-out/screens
            ${{ runner.temp }}/maker-out/*.txt
            ${{ runner.temp }}/maker-out/*.json
            ${{ runner.temp }}/maker-out/*.sha256
          if-no-files-found: warn
          retention-days: 14
